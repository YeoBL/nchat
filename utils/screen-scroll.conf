# Screen 5.0.2 can spin in its default `stuff` key translations when its
# 4096-byte input queue fills. Forward arrows and Page Up/Down directly instead.
# Kitty and Screen use the same sequences for these keys; copy mode keeps its
# own bindings. Home/End need translation and are deliberately unchanged.
# Source this file from ~/.screenrc and in existing sessions.
bindkey -d -k ku
bindkey -d -k kd
bindkey -d -k kl
bindkey -d -k kr
bindkey -d -a -k ku
bindkey -d -a -k kd
bindkey -d -a -k kl
bindkey -d -a -k kr
bindkey -d -k kP
bindkey -d -k kN
