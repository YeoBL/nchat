# Optional nchat-specific Kitty mappings. Include this file from kitty.conf.
# Install nchat_badge.py and nchat_badge_auth.py beside kitty.conf first.
# Badge remote control is opt-in and restricted to the authorization helper.
# Uncomment these lines to enable it; never enable broad remote control.
# allow_remote_control password
# remote_control_password "" nchat_badge_auth.py
# map ctrl+shift+f12 kitten nchat_badge.py enable

macos_option_as_alt both

# Inline images, attachment list, and native file preview.
map cmd+v send_text all \x1bv
map cmd+shift+v send_text all \x16f
map cmd+opt+v send_text all \x16p

# Forward the selected message.
map cmd+shift+f send_text all \x1br

# Open full detected URLs with Command-click or double-click.
mouse_map cmd+left click ungrabbed mouse_click_url
mouse_map left doublepress ungrabbed mouse_click_url
